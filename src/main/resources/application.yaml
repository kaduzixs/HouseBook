spring:
  application:
    name: company

  datasource:
    url: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/housebook
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true