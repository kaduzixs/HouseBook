
spring:
  application:
    name: company

  datasource:
    url: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/housebook?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  web:
    servlet:
      multipart:
        max-file-size: 2MB
        max-request-size: 3MB

google:
  books:
    api:
      key: ${BOOKS_KEY:}
