
spring:
  application:
    name: company

  # Configuração de conexão com o Supabase
  datasource:
    url: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configurações do Hibernate e JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # O padrão do Spring é 1 MB; o app aceita TXT de até 5 MB e foto de perfil de até 2 MB.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB